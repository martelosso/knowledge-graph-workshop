<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tinkerers Medellín</title>

<!-- CodeMirror 5 — works from file:// without workers -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #f7f5f1;
  --surface:    #ffffff;
  --surface2:   #f0ede7;
  --border:     #e5e0d8;
  --text:       #1c1917;
  --muted:      #78716c;
  --muted2:     #a8a29e;
  --accent:     #44403c;
  --accent-dim: rgba(68,64,60,.07);
  --green:      #15803d;
  --amber:      #b45309;
  --red:        #b91c1c;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system,'Segoe UI',system-ui,sans-serif;
  font-size: 13px; overflow: hidden;
}

/* ── Toolbar ── */
#toolbar {
  height: 48px; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
}
.wordmark {
  font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--text); user-select: none;
}

.wordmark-file {
  font-size: 11px; font-family: 'SF Mono','Fira Code',Menlo,monospace;
  color: var(--muted2); font-weight: 400; letter-spacing: 0;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px;
}
.sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
.btn {
  height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 12px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: border-color .12s, background .12s, color .12s; line-height: 1;
}
.btn:hover { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.tog {
  height: 28px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: 11px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: all .12s; line-height: 1;
}
.tog.on { background: var(--accent); border-color: var(--accent); color: #ffffff; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Main split ── */
#main { display: flex; height: calc(100vh - 48px - 28px); }

/* ── Editor pane ── */
#epane {
  width: 46%; min-width: 180px; display: flex; flex-direction: column;
  flex-shrink: 0; border-right: 1px solid var(--border);
}
.pane-bar {
  height: 34px; background: var(--surface2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 14px; gap: 8px; flex-shrink: 0;
  font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
}
.pane-bar .fname {
  text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; color: var(--text);
}
#cm-wrap { flex: 1; overflow: hidden; position: relative; }

/* ── CodeMirror custom theme (turtle-light) ── */
.cm-s-turtle-light.CodeMirror {
  height: 100%; background: #f7f5f1; color: #292524;
  font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Monaco,'Courier New',monospace;
  font-size: 13px; line-height: 1.75;
}
.cm-s-turtle-light .CodeMirror-gutters    { background: #f0ede7; border-right: 1px solid #e5e0d8; }
.cm-s-turtle-light .CodeMirror-linenumber { color: #c4bfba; padding: 0 8px 0 6px; }
.cm-s-turtle-light .CodeMirror-cursor     { border-left: 2px solid #44403c; }
.cm-s-turtle-light .CodeMirror-selected   { background: #e2ddd6; }
.cm-s-turtle-light div.CodeMirror-selected { background: #e2ddd6; }
.cm-s-turtle-light .CodeMirror-activeline-background { background: #edeae4; }
.cm-s-turtle-light .CodeMirror-scrollbar-filler,
.cm-s-turtle-light .CodeMirror-gutter-filler { background: #f0ede7; }
/* Token colors */
.cm-s-turtle-light .cm-comment    { color: #b8b3ae; font-style: italic; }
.cm-s-turtle-light .cm-keyword    { color: #7c3aed; font-weight: 700; }
.cm-s-turtle-light .cm-atom       { color: #7c3aed; font-weight: 700; }
.cm-s-turtle-light .cm-string     { color: #166534; }
.cm-s-turtle-light .cm-string-2   { color: #1d4ed8; }
.cm-s-turtle-light .cm-variable-2 { color: #92400e; }
.cm-s-turtle-light .cm-def        { color: #6b21a8; }
.cm-s-turtle-light .cm-number     { color: #b45309; }
.cm-s-turtle-light .cm-meta       { color: #b45309; }
.cm-s-turtle-light .cm-operator   { color: #1d4ed8; }
.cm-s-turtle-light .cm-punctuation{ color: #9ca3af; }

/* ── Drag handle ── */
#drag {
  width: 5px; background: var(--border); cursor: col-resize; flex-shrink: 0;
  position: relative; transition: background .12s; z-index: 10;
}
#drag:hover, #drag.on { background: var(--accent); }

/* ── Graph pane ── */
#gpane { flex: 1; display: flex; flex-direction: column; min-width: 180px; overflow: hidden; }
#net-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
#network { width: 100%; height: 100%; }

/* ── Empty state ── */
#empty {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: var(--muted2); pointer-events: none;
}
#empty svg { opacity: .25; stroke: var(--muted2); }
#empty p   { font-size: 13px; opacity: .6; }

/* ── Legend ── */
#legend {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; display: none; flex-direction: column; gap: 6px;
  font-size: 11px; color: var(--muted);
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.leg { display: flex; align-items: center; gap: 8px; }
.leg-box { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-dia { width: 10px; height: 10px; transform: rotate(45deg); border-radius: 2px; flex-shrink: 0; }

/* ── Status bar ── */
#statusbar {
  height: 28px; background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 14px;
  font-size: 11px; color: var(--muted); flex-shrink: 0;
}
.si { display: flex; align-items: center; gap: 5px; }
.sd { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.sd.err  { background: var(--red); }
.sd.busy { background: var(--amber); animation: blink .9s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
#errmsg { margin-left: auto; color: var(--red); max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── vis-network tooltip ── */
.vis-tooltip {
  background: #ffffff !important; border: 1px solid #e5e0d8 !important;
  color: #1c1917 !important; border-radius: 6px !important;
  font: 11px/1.5 monospace !important; padding: 8px 10px !important;
  box-shadow: 0 4px 16px rgba(0,0,0,.10) !important;
  max-width: 280px !important; white-space: pre-wrap !important;
}

#file-input { display: none; }
</style>
</head>
<body>

<!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
<div id="toolbar">
  <span class="wordmark">AI Tinkerers Medellín</span>
  <span class="wordmark-file" id="fname">untitled.ttl</span>

  <div class="sep"></div>

  <button class="btn" onclick="openFile()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    Open .ttl
  </button>
  <button class="btn" onclick="saveFile()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Save
  </button>

  <div class="sep"></div>

  <button class="tog on" id="tog-schema" onclick="toggleFilter('schema')">
    <div class="dot" style="background:#3b82f6"></div> Schema
  </button>
  <button class="tog on" id="tog-data" onclick="toggleFilter('data')">
    <div class="dot" style="background:#ea580c"></div> Instances
  </button>

  <div class="sep"></div>

  <button class="tog" id="tog-hier" onclick="toggleLayout()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="5" height="5" rx="1"/><rect x="8" y="15" width="5" height="5" rx="1"/><line x1="5" y1="8" x2="10" y2="15"/><line x1="19" y1="8" x2="10" y2="15"/></svg>
    Tree layout
  </button>
  <button class="btn" onclick="fitGraph()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    Fit
  </button>
</div>

<!-- ── Main split pane ─────────────────────────────────────────────────── -->
<div id="main">

  <!-- Left: code editor -->
  <div id="epane">
    <div class="pane-bar">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Editor
    </div>
    <div id="cm-wrap"></div>
  </div>

  <!-- Drag handle -->
  <div id="drag"></div>

  <!-- Right: live graph -->
  <div id="gpane">
    <div class="pane-bar">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="2"/><circle cx="3" cy="6" r="2"/><circle cx="21" cy="6" r="2"/><circle cx="3" cy="18" r="2"/><circle cx="21" cy="18" r="2"/><line x1="5" y1="7" x2="10" y2="11"/><line x1="14" y1="11" x2="19" y2="7"/><line x1="5" y1="17" x2="10" y2="13"/><line x1="14" y1="13" x2="19" y2="17"/></svg>
      Graph Preview
      <span id="gsub" style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted2);font-size:10px;margin-left:4px">— start typing to visualize</span>
    </div>
    <div id="net-wrap">
      <div id="network"></div>
      <div id="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke-width="1"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><line x1="12" y1="7" x2="5" y2="17"/><line x1="12" y1="7" x2="19" y2="17"/><line x1="5" y1="19" x2="19" y2="19"/></svg>
        <p>Write Turtle syntax to see the graph</p>
      </div>
      <div id="legend">
        <div class="leg"><div class="leg-box" style="background:#3b82f6"></div> Class</div>
        <div class="leg"><div class="leg-dia" style="background:#d97706"></div> Object Property</div>
        <div class="leg"><div class="leg-dia" style="background:#16a34a"></div> Datatype Property</div>
        <div class="leg"><div class="leg-box" style="border-radius:50%;background:#a855f7"></div> Ontology</div>
        <div class="leg"><div class="leg-box" style="border-radius:50%;background:#ea580c"></div> Instance</div>
      </div>
    </div>
  </div>
</div>

<!-- ── Status bar ──────────────────────────────────────────────────────── -->
<div id="statusbar">
  <div class="si"><div class="sd" id="sd"></div><span id="st">Ready</span></div>
  <span id="tc" style="display:none"></span>
  <span id="nc" style="display:none"></span>
  <span id="errmsg"></span>
</div>

<input type="file" id="file-input" accept=".ttl,.turtle">

<script src="vis-network.min.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 1. CodeMirror — Turtle syntax mode
// ═══════════════════════════════════════════════════════════════════
CodeMirror.defineMode('turtle', function () {
  return {
    startState: () => ({ inString: false }),
    token(stream) {
      if (stream.match(/^\s*#.*/)) return 'comment';
      if (stream.eatSpace()) return null;
      if (stream.match('"""')) {
        while (!stream.match('"""')) { if (stream.next() === null) break; }
        return 'string';
      }
      if (stream.peek() === '"') {
        stream.next();
        while (!stream.eol()) {
          const ch = stream.next();
          if (ch === '\\') { stream.next(); continue; }
          if (ch === '"') break;
        }
        return 'string';
      }
      if (stream.match(/<[^>]*>/)) return 'string-2';
      if (stream.match(/@prefix\b/) || stream.match(/@base\b/)) return 'keyword';
      if (stream.match(/^(?:prefix|base)\b/i)) return 'keyword';
      if (stream.match(/@[a-zA-Z][a-zA-Z-]*/)) return 'meta';
      if (stream.match(/\^\^/)) return 'operator';
      if (stream.match(/^a(?=[\s.,;]|$)/)) return 'atom';
      if (stream.match(/^(?:true|false)\b/)) return 'atom';
      if (stream.match(/^-?\d+\.?\d*(?:[eE][+-]?\d+)?/)) return 'number';
      if (stream.match(/^[a-zA-Z_][\w-]*:[a-zA-Z_][\w.-]*/)) return 'variable-2';
      if (stream.match(/^[a-zA-Z_][\w-]*:/)) return 'def';
      if (stream.match(/^[.,;]/)) return 'punctuation';
      stream.next();
      return null;
    },
  };
});

// ═══════════════════════════════════════════════════════════════════
// 2. Turtle parser
// ═══════════════════════════════════════════════════════════════════
const RDF_TYPE = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type';
const RDFS     = 'http://www.w3.org/2000/01/rdf-schema#';
const OWL      = 'http://www.w3.org/2002/07/owl#';
const XSD      = 'http://www.w3.org/2001/XMLSchema#';
const SCHEMA_TYPES = new Set([OWL+'Class',OWL+'ObjectProperty',OWL+'DatatypeProperty',OWL+'Ontology']);

const TOK_RE = new RegExp([
  '#[^\\n]*',
  '"""(?:[^\\\\]|\\\\.)*?"""',
  '"(?:[^"\\\\]|\\\\.)*"',
  '<[^>]*>',
  '\\^\\^[\\w-]+:[\\w.-]+',
  '\\^\\^<[^>]*>',
  '@[a-zA-Z][a-zA-Z-]*',
  '[\\w-]*:[\\w.-]+',
  '[\\w-]*:',
  '[.,;]',
  '-?\\d+\\.\\d+',
  '-?\\d+',
  '[A-Za-z_][\\w-]*',
].join('|'), 'g');

function parseTurtle(src) {
  const toks = [];
  let m; TOK_RE.lastIndex = 0;
  while ((m = TOK_RE.exec(src)) !== null)
    if (!m[0].startsWith('#')) toks.push(m[0]);

  const pfx = {}, triples = [];
  let i = 0;

  function resolve(pn) {
    const k = pn.indexOf(':');
    const ns = pn.slice(0, k), loc = pn.slice(k + 1);
    return (ns in pfx) ? pfx[ns] + loc : pn;
  }

  function term() {
    const t = toks[i];
    if (!t) throw new Error('Unexpected end of input.');
    if (t.startsWith('<'))              { i++; return { type:'iri', value:t.slice(1,-1) }; }
    if (t === 'a')                      { i++; return { type:'iri', value:RDF_TYPE }; }
    if (t === 'true' || t === 'false')  { i++; return { type:'literal', value:t, datatype:XSD+'boolean' }; }
    if (t.startsWith('"')) {
      i++;
      const q = t.startsWith('"""') ? 3 : 1;
      let val = t.slice(q, t.length - q).replace(/\\(.)/g, (_,c) =>
        ({n:'\n',t:'\t',r:'\r','"':'"','\\':'\\'}[c]||c));
      let lang = null, dt = null;
      const nx = toks[i];
      if (nx && nx.startsWith('@'))   { lang = nx.slice(1); i++; }
      else if (nx && nx.startsWith('^^')) {
        const raw = nx.slice(2);
        dt = raw.startsWith('<') ? raw.slice(1,-1) : resolve(raw);
        i++;
      }
      return { type:'literal', value:val, lang, datatype:dt };
    }
    if (/^-?\d+\.\d+$/.test(t)) { i++; return { type:'literal', value:t, datatype:XSD+'decimal' }; }
    if (/^-?\d+$/.test(t))      { i++; return { type:'literal', value:t, datatype:XSD+'integer' }; }
    if (t.includes(':'))        { i++; return { type:'iri', value:resolve(t) }; }
    throw new Error(`Unexpected token "${t}".`);
  }

  while (i < toks.length) {
    const t0 = toks[i];
    if (t0 === '@prefix' || t0 === 'prefix') {
      i++;
      const label = toks[i]; i++;
      const iri   = toks[i]; i++;
      pfx[label.slice(0,-1)] = iri.slice(1,-1);
      if (toks[i] === '.') i++;
      continue;
    }
    if (t0 === '@base' || t0 === 'base') { i++; i++; if (toks[i]==='.') i++; continue; }

    const subj = term();
    loop: while (true) {
      const pred = term();
      let obj = term();
      triples.push({ subj, pred, obj });
      while (toks[i] === ',') { i++; obj = term(); triples.push({ subj, pred, obj }); }
      switch (toks[i]) {
        case ';': i++; if (toks[i] === '.') { i++; break loop; } break;
        case '.': i++; break loop;
        default:  break loop;
      }
    }
  }
  return triples;
}

// ═══════════════════════════════════════════════════════════════════
// 3. Triples → vis-network nodes + edges
// ═══════════════════════════════════════════════════════════════════
function localName(iri) {
  const m = /[#\/]([^#\/]+)$/.exec(iri);
  return m ? m[1] : iri;
}

function buildGraph(triples) {
  const nodes = new Map(), edges = [];

  function node(iri) {
    if (!nodes.has(iri))
      nodes.set(iri, { id:iri, label:localName(iri), kind:'resource', group:null, attrs:{}, comment:null });
    return nodes.get(iri);
  }

  for (const { subj, pred, obj } of triples) {
    if (subj.type !== 'iri') continue;
    const s = node(subj.value);
    const p = pred.value;

    if (obj.type === 'literal') {
      if (p === RDFS+'label')        s.label = obj.value;
      else if (p === RDFS+'comment') s.comment = obj.value;
      else                           s.attrs[localName(p)] = obj.value;
      continue;
    }

    if (p === RDF_TYPE) {
      if (SCHEMA_TYPES.has(obj.value)) {
        s.kind = localName(obj.value);
      } else {
        node(obj.value);
        if (!s.group) s.group = localName(obj.value);
        edges.push({ from:s.id, to:obj.value, label:'a', kind:'type' });
      }
      continue;
    }

    node(obj.value);
    if (p === RDFS+'domain') {
      edges.push({ from:obj.value, to:s.id, label:'domain', kind:'schema' });
    } else {
      const sk = (p===RDFS+'range'||p===RDFS+'subClassOf') ? 'schema' : 'data';
      edges.push({ from:s.id, to:obj.value, label:localName(p), kind:sk });
    }
  }

  return { nodes:[...nodes.values()], edges };
}

// ═══════════════════════════════════════════════════════════════════
// 4. vis-network rendering
// ═══════════════════════════════════════════════════════════════════
const NODE_STYLE = {
  Class: {
    shape:'box',
    color:{ background:'#eff6ff', border:'#3b82f6', highlight:{background:'#dbeafe',border:'#2563eb'} },
    font:{ color:'#1e40af', size:12, face:'monospace' },
    borderWidth:1.5, borderWidthSelected:2.5, margin:8,
    shadow:{ enabled:true, color:'rgba(59,130,246,.12)', size:6, x:0, y:2 },
  },
  ObjectProperty: {
    shape:'diamond',
    color:{ background:'#fffbeb', border:'#d97706', highlight:{background:'#fef3c7',border:'#b45309'} },
    font:{ color:'#92400e', size:10, face:'monospace' },
    borderWidth:1.5, size:16,
    shadow:{ enabled:true, color:'rgba(217,119,6,.12)', size:5, x:0, y:2 },
  },
  DatatypeProperty: {
    shape:'diamond',
    color:{ background:'#f0fdf4', border:'#16a34a', highlight:{background:'#dcfce7',border:'#15803d'} },
    font:{ color:'#15803d', size:10, face:'monospace' },
    borderWidth:1.5, size:14,
    shadow:{ enabled:true, color:'rgba(22,163,74,.12)', size:5, x:0, y:2 },
  },
  Ontology: {
    shape:'hexagon',
    color:{ background:'#fdf4ff', border:'#a855f7', highlight:{background:'#fae8ff',border:'#7e22ce'} },
    font:{ color:'#7e22ce', size:12, face:'monospace' },
    borderWidth:1.5,
    shadow:{ enabled:true, color:'rgba(168,85,247,.12)', size:6, x:0, y:2 },
  },
  resource: {
    shape:'dot', size:10,
    color:{ background:'#fff7ed', border:'#ea580c', highlight:{background:'#ffedd5',border:'#c2410c'} },
    font:{ color:'#9a3412', size:11 },
    borderWidth:1.5,
  },
};

const EDGE_COLOR = {
  schema:{ color:'#c8c2b8', highlight:'#78716c', hover:'#78716c' },
  data:  { color:'#d8d2c8', highlight:'#78716c', hover:'#78716c' },
  type:  { color:'#d4cec8', highlight:'#a8a29e', hover:'#a8a29e' },
};

const isSchema = k => ['Class','ObjectProperty','DatatypeProperty','Ontology'].includes(k);

let network    = null;
let curGraph   = null;
let showSchema = true;
let showData   = true;
let treeLayout = false;

function render(graph) {
  const vNodes = graph.nodes.filter(n => isSchema(n.kind) ? showSchema : showData);
  const vIds   = new Set(vNodes.map(n => n.id));
  const vEdges = graph.edges.filter(e => {
    if (e.kind === 'schema' && !showSchema) return false;
    return vIds.has(e.from) && vIds.has(e.to);
  });

  const nodeItems = vNodes.map(n => {
    const s = NODE_STYLE[n.kind] || NODE_STYLE.resource;
    const attrs = Object.entries(n.attrs).map(([k,v]) => `${k}: ${v}`).join('\n');
    const tip   = [n.comment, attrs].filter(Boolean).join('\n\n') || n.label;
    const pin   = n.kind === 'Ontology' ? { physics: false, x: 0, y: -280 } : {};
    return { id:n.id, label:n.label, title:tip, ...s, ...pin };
  });

  const edgeItems = vEdges.map((e,i) => ({
    id:i, from:e.from, to:e.to, label:e.label,
    dashes: e.kind === 'schema' || e.kind === 'type',
    arrows:{ to:{ enabled:true, scaleFactor:.65 } },
    color: EDGE_COLOR[e.kind] || EDGE_COLOR.data,
    font:{ size:10, color:'#a8a29e', background:'rgba(247,245,241,.9)', align:'top', strokeWidth:0 },
    smooth:{ type:'curvedCW', roundness:.08 },
    width:1, selectionWidth:2,
  }));

  const opts = {
    physics: treeLayout ? false : {
      solver:'forceAtlas2Based',
      forceAtlas2Based:{ gravitationalConstant:-45, centralGravity:.012, springLength:130, springConstant:.06, damping:.65, avoidOverlap:.5 },
      stabilization:{ iterations:250, fit:true },
    },
    layout: treeLayout
      ? { hierarchical:{ direction:'UD', sortMethod:'hubsize', levelSeparation:110, nodeSpacing:140 } }
      : { randomSeed:42 },
    interaction:{ hover:true, tooltipDelay:200 },
  };

  if (network) { network.destroy(); network = null; }
  network = new vis.Network(
    document.getElementById('network'),
    { nodes: new vis.DataSet(nodeItems), edges: new vis.DataSet(edgeItems) },
    opts
  );
}

// ═══════════════════════════════════════════════════════════════════
// 5. Parse + render pipeline (debounced, 380 ms)
// ═══════════════════════════════════════════════════════════════════
let debounce = null;

function scheduleRender(text) {
  setStatus('busy');
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    if (!text.trim()) { setStatus('ok'); document.getElementById('empty').style.display='flex'; return; }
    try {
      const triples = parseTurtle(text);
      curGraph = buildGraph(triples);
      render(curGraph);

      document.getElementById('tc').style.display = '';
      document.getElementById('nc').style.display = '';
      document.getElementById('tc').textContent = `${triples.length} triples`;
      document.getElementById('nc').textContent = `${curGraph.nodes.length} nodes`;
      document.getElementById('errmsg').textContent = '';
      document.getElementById('empty').style.display  = 'none';
      document.getElementById('legend').style.display = curGraph.nodes.length ? 'flex' : 'none';
      document.getElementById('gsub').textContent =
        `— ${curGraph.nodes.length} nodes · ${curGraph.edges.length} edges`;
      setStatus('ok');
    } catch (err) {
      document.getElementById('errmsg').textContent = '⚠ ' + err.message;
      setStatus('err');
    }
  }, 380);
}

function setStatus(s) {
  document.getElementById('sd').className = 'sd' + (s==='err'?' err':s==='busy'?' busy':'');
  document.getElementById('st').textContent = s==='ok'?'Valid' : s==='err'?'Parse error':'Parsing…';
}

// ═══════════════════════════════════════════════════════════════════
// 6. Toolbar actions
// ═══════════════════════════════════════════════════════════════════
function toggleFilter(which) {
  if (which === 'schema') { showSchema = !showSchema; document.getElementById('tog-schema').classList.toggle('on', showSchema); }
  else                    { showData   = !showData;   document.getElementById('tog-data').classList.toggle('on', showData); }
  if (curGraph) render(curGraph);
}

function toggleLayout() {
  treeLayout = !treeLayout;
  document.getElementById('tog-hier').classList.toggle('on', treeLayout);
  if (curGraph) render(curGraph);
}

function fitGraph() {
  if (network) network.fit({ animation:{ duration:400, easingFunction:'easeInOutQuad' } });
}

// ═══════════════════════════════════════════════════════════════════
// 7. File open / save
// ═══════════════════════════════════════════════════════════════════
let filename = 'untitled.ttl';

function openFile() { document.getElementById('file-input').click(); }

document.getElementById('file-input').addEventListener('change', ev => {
  const file = ev.target.files[0]; if (!file) return;
  filename = file.name;
  document.getElementById('fname').textContent = file.name;
  const r = new FileReader();
  r.onload = () => { if (window._cm) window._cm.setValue(r.result); };
  r.readAsText(file);
  ev.target.value = '';
});

function saveFile() {
  const content = window._cm ? window._cm.getValue() : '';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type:'text/turtle' }));
  a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════════
// 8. Drag-to-resize panes
// ═══════════════════════════════════════════════════════════════════
const dragEl = document.getElementById('drag');
const epane  = document.getElementById('epane');
let dragging=false, dragX0=0, dragW0=0;

dragEl.addEventListener('mousedown', e => {
  dragging=true; dragX0=e.clientX; dragW0=epane.getBoundingClientRect().width;
  dragEl.classList.add('on');
  document.body.style.cssText += ';cursor:col-resize;user-select:none;';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const total = document.getElementById('main').getBoundingClientRect().width;
  const w = Math.min(Math.max(dragW0 + e.clientX - dragX0, 180), total - 180);
  epane.style.width = w + 'px';
  epane.style.flex  = 'none';
  if (window._cm) window._cm.refresh();
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  dragEl.classList.remove('on');
  document.body.style.cursor = ''; document.body.style.userSelect = '';
});

// ═══════════════════════════════════════════════════════════════════
// 9. Boot: create CodeMirror editor with starter content
// ═══════════════════════════════════════════════════════════════════
const STARTER = `# Write Turtle here — the graph on the right updates as you type.
# Open an existing .ttl with the toolbar button, or start from scratch.

@prefix :    <https://example.org/myontology/> .
@prefix owl: <http://www.w3.org/2002/07/owl#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .

<https://example.org/myontology/>
    a owl:Ontology ;
    rdfs:label "My Ontology"@en .

# ── Classes ──────────────────────────────────────────────

:Person
    a owl:Class ;
    rdfs:label "Person"@en ;
    rdfs:comment "A human being."@en .

:Employee
    a owl:Class ;
    rdfs:subClassOf :Person ;
    rdfs:label "Employee"@en .

:Organization
    a owl:Class ;
    rdfs:label "Organization"@en .

# ── Object properties ────────────────────────────────────

:worksFor
    a owl:ObjectProperty ;
    rdfs:domain :Employee ;
    rdfs:range  :Organization ;
    rdfs:label  "works for"@en .

:manages
    a owl:ObjectProperty ;
    rdfs:domain :Employee ;
    rdfs:range  :Employee ;
    rdfs:label  "manages"@en .

# ── Datatype properties ──────────────────────────────────

:name
    a owl:DatatypeProperty ;
    rdfs:domain :Person ;
    rdfs:range  xsd:string ;
    rdfs:label  "name"@en .

:foundedYear
    a owl:DatatypeProperty ;
    rdfs:domain :Organization ;
    rdfs:range  xsd:integer ;
    rdfs:label  "founded year"@en .
`;

window._cm = CodeMirror(document.getElementById('cm-wrap'), {
  value:        STARTER,
  mode:         'turtle',
  theme:        'turtle-light',
  lineNumbers:  true,
  lineWrapping: false,
  indentUnit:   4,
  tabSize:      4,
  autofocus:    true,
  extraKeys:    { Tab: cm => cm.execCommand('insertSoftTab') },
});

window._cm.on('change', () => scheduleRender(window._cm.getValue()));
scheduleRender(STARTER);
</script>
</body>
